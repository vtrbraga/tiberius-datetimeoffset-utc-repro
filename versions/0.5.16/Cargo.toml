[package]
name = "dto-repro"
version = "0.1.0"
edition = "2021"
publish = false
description = "tiberius =0.5.16"

[[bin]]
name = "dto-repro"
path = "../../src/main.rs"

[features]
time-path = []

[dependencies]
tiberius = { version = "=0.5.16", features = ["tds73", "chrono"] }
chrono = "=0.4.45"

tokio = { version = "=1.53.3", features = ["rt", "net", "macros"] }
tokio-util = { version = "=0.7.20", features = ["compat"] }

[workspace]
